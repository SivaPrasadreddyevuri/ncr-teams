name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci requires the lockfile to match package.json exactly, which is
      # what makes this a real check rather than a reinstall.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Migrations and seed
    runs-on: ubuntu-latest

    # A real PostgreSQL, so the migrations are exercised rather than just parsed.
    # A migration that applies locally but not on a clean instance is a defect
    # that otherwise surfaces at deploy time, which is the worst place to find it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Pointed at a throwaway name: this job creates and drops it freely, and
      # it must never be mistakable for a real database.
      DATABASE_URL: postgresql://ncr_app:ncr_app_ci@127.0.0.1:5432/ncr_teams_ci?schema=public
      POSTGRES_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create the application role and database
        run: npm run db:bootstrap

      # `migrate deploy`, not `migrate dev`: dev would try to create a shadow
      # database and prompt for a migration name, neither of which belongs in CI.
      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      - name: Verify the seeded data
        run: npm run db:verify

  api:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # setup-env.ts points the suite at ncr_teams_test on this server, creating
      # and seeding it before the run. Both URLs are the same here because there
      # is no pooler in CI; the split only matters on a real deployment.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ncr_teams_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ncr_teams_test?schema=public
      SESSION_PEPPER: ci-pepper-fixed-value-at-least-32-chars

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `pretest` creates the test database, applies the real migrations, and
      # seeds it, so the suite runs against the same artefacts a deploy would.
      - name: Test
        run: npm test
