name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci requires the lockfile to match package.json exactly, which is
      # what makes this a real check rather than a reinstall.
      - name: Install
        run: npm ci

      # See the note in the database job: generation is explicit, not a postinstall.
      # The backend typecheck imports @prisma/client, so it needs the client here.
      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Migrations and seed
    runs-on: ubuntu-latest

    # A real PostgreSQL, so the migrations are exercised rather than just parsed.
    # A migration that applies locally but not on a clean instance is a defect
    # that otherwise surfaces at deploy time, which is the worst place to find it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Pointed at a throwaway name: this job creates and drops it freely, and
      # it must never be mistakable for a real database.
      DATABASE_URL: postgresql://ncr_app:ncr_app_ci@127.0.0.1:5432/ncr_teams_ci?schema=public
      POSTGRES_SUPERUSER_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      # `migrate diff` needs an empty database to replay the migrations into. A
      # different name from the one under test, because it drops and recreates its
      # schema on every run.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ncr_teams_shadow?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The Prisma client is generated explicitly rather than from a root
      # `postinstall`. Vercel builds this repo's frontend as a standalone project
      # and installs only the `frontend` workspace, so a root postinstall would run
      # `prisma generate` with the `database` workspace's CLI absent and fail the
      # whole deploy. Generation is a build step for whoever needs the client, not
      # a side effect of installing.
      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Create the application role and database
        run: npm run db:bootstrap

      # `migrate deploy`, not `migrate dev`: dev would try to create a shadow
      # database and prompt for a migration name, neither of which belongs in CI.
      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      - name: Verify the seeded data
        run: npm run db:verify

      # The search indexes are the one part of the schema Prisma cannot represent,
      # so `migrate dev` would helpfully write a migration that drops them. This
      # asserts that the diff still contains nothing but the known, expected
      # entries -- so a genuine unintended change cannot hide among them.
      - name: Check for unexpected schema drift
        run: npm run db:drift

      # Asserts the GIN and trigram indexes are actually usable for the queries the
      # search route issues. Without it, a migration that failed to create an index
      # would pass every other check and search would return nothing at runtime.
      - name: Verify the search indexes are used
        run: npm run db:verify:plans

  api:
    name: Tests
    runs-on: ubuntu-latest

    # Both suites run here rather than splitting the pure frontend tests into
    # their own job. The frontend ones need no database and would be wasted
    # spinning one up, but they are eleven assertions against a single function,
    # and a second job costs more in workflow time than it saves.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # setup-env.ts points the suite at ncr_teams_test on this server, creating
      # and seeding it before the run. Both URLs are the same here because there
      # is no pooler in CI; the split only matters on a real deployment.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ncr_teams_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ncr_teams_test?schema=public
      SESSION_PEPPER: ci-pepper-fixed-value-at-least-32-chars

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The backend suite imports @prisma/client, so the client has to exist
      # before the tests run. See the note in the database job.
      - name: Generate the Prisma client
        run: npm run db:generate

      # The backend's `pretest` creates the test database, applies the real
      # migrations, and seeds it, so that suite runs against the same artefacts a
      # deploy would. The frontend suite needs none of that and runs after it.
      - name: Test
        run: npm test
